[project]
name = "inkwire-receiver-core"
version = "1.1.0"
description = "The Inkwire receiver for Python: core, stores and a FastAPI app."
readme = "README.md"
license = "MIT"
authors = [{ name = "Isaac Gounton" }]
requires-python = ">=3.11"
dependencies = ["pydantic>=2.9", "markdown>=3.7", "nh3>=0.2.18", "email-validator>=2.0", "pyyaml>=6.0", "httpx>=0.27"]

[project.urls]
Repository = "https://github.com/dahoai/inkwire"
Documentation = "https://github.com/dahoai/inkwire/blob/master/inkwire/SPEC.md"

[project.optional-dependencies]
fastapi = ["fastapi>=0.115", "python-multipart>=0.0.9"]
dev = ["fastapi>=0.115", "python-multipart>=0.0.9", "pytest>=8.3", "httpx>=0.27", "uvicorn>=0.30"]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["inkwire_receiver*"]

[tool.pytest.ini_options]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`"]
