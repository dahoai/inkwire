[project]
name = "inkwire-client"
version = "1.0.0"
description = "Python client for Inkwire receivers: publish, read, edit, terms and media (idempotent, retrying, typed errors)."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27"]

[project.urls]
Repository = "https://github.com/dahoai/inkwire"

[project.optional-dependencies]
dev = ["pytest>=8.3"]

[tool.setuptools.packages.find]
include = ["inkwire_client*"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
